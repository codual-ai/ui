name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift format lint --strict -r Sources Tests Package.swift
      # StoreKit Testing runs on its own: its session holds up the main thread of every test running beside it.
      - name: Build and test on an iOS simulator
        run: |
          device=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone' | grep -oE '[0-9A-F-]{36}')
          xcodebuild test -scheme CodualUI -destination "id=$device" -skip-testing:CodualUIStoreKitTests -quiet \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult"
          xcodebuild test -scheme CodualUI -destination "id=$device" -only-testing:CodualUIStoreKitTests -quiet \
            -resultBundlePath "$RUNNER_TEMP/storekit-tests.xcresult"
      # xcodebuild -quiet names a failed test without its message; the result bundle has it.
      - name: Show test failures
        if: failure()
        run: |
          bundles=$(ls -d "$RUNNER_TEMP"/*.xcresult 2>/dev/null || true)
          [ -n "$bundles" ] && python3 .github/scripts/print-test-failures.py $bundles
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: swift-test-results
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.gradle.kts
      # Robolectric downloads its Android jar from Maven on first use; keep it between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/gradle/libs.versions.toml') }}
      # Lint, unit tests and the library build, with the Android SDK the runner image has at $ANDROID_HOME.
      - run: ./gradlew build --no-daemon

  react-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: react-native/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18
          cache: pnpm
          cache-dependency-path: react-native/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  spec-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: scripts/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18
          cache: pnpm
          cache-dependency-path: scripts/pnpm-lock.yaml
      # Type-checks, lints and tests the checker, then runs it on spec/ and every platform's tests.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
